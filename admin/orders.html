<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | ParcelPro Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/dashboard.css" rel="stylesheet">
</head>
<body class="dashboard-body" data-admin-page="orders">
  <aside class="dash-sidebar" id="adminSidebar">
    <a class="dash-brand" href="dashboard.html"><i class="bi bi-shield-check me-2"></i>ParcelPro Admin</a>
    <nav class="dash-nav nav flex-column" aria-label="Admin navigation">
      <a class="nav-link" href="dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
      <a class="nav-link active" href="orders.html"><i class="bi bi-box-seam"></i>Orders</a>
      <a class="nav-link" href="customers.html"><i class="bi bi-people"></i>Users</a>
      <a class="nav-link" href="payments.html"><i class="bi bi-credit-card"></i>Payments</a>
      <a class="nav-link" href="services.html"><i class="bi bi-truck"></i>Services</a>
      <a class="nav-link" href="pricing.html"><i class="bi bi-tags"></i>Pricing</a>
      <a class="nav-link" href="blog.html"><i class="bi bi-newspaper"></i>Blog</a>
      <a class="nav-link" href="messages.html"><i class="bi bi-envelope"></i>Messages</a>
      <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i>Reports</a>
      <a class="nav-link" href="settings.html"><i class="bi bi-gear"></i>Settings</a>
      <hr>
      <button class="nav-link text-start border-0 bg-transparent w-100" type="button" data-logout><i class="bi bi-box-arrow-right"></i>Logout</button>
    </nav>
  </aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop></div>

  <main class="dash-main">
    <header class="dash-topbar">
      <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="Open menu" aria-controls="adminSidebar" aria-expanded="false"><i class="bi bi-list"></i></button>
      <span class="text-muted"><i class="bi bi-person-circle me-1"></i>Administrator</span>
    </header>

    <section class="dash-content">
      <h1 class="page-title">Orders</h1>
      <p class="page-subtitle mb-4">Review every parcel created by ParcelPro users.</p>
      <div class="card simple-card">
        <div class="card-body">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div class="input-group" style="max-width: 360px;">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input class="form-control" id="orderSearch" type="search" placeholder="Search parcels" aria-label="Search parcels">
            </div>
            <span class="text-muted small" id="ordersCount">0 parcels</span>
          </div>
          <div class="table-responsive">
            <table id="ordersTable" class="table">
              <thead><tr><th>Parcel ID</th><th>Customer</th><th>Receiver</th><th>Route</th><th>Date</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
          <p class="text-muted text-center py-4 mb-0 d-none" id="ordersEmpty">No parcels match your search.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/parcelpro-store.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
